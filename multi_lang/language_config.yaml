# Multi-Language Support Layer Configuration
# Fractal Multi-Agent Coding System - Session 22/23

multi_lang:
  languages:
    - python
    - node
    - go
    - rust
    - java

  default_language: "python"

  python:
    version: "3.10"
    frameworks: ["fastapi", "django", "flask"]
    default_framework: "fastapi"
    formatter: "black"
    test_framework: "pytest"

  node:
    version: "18"
    frameworks: ["express", "nestjs", "fastify"]
    default_framework: "express"
    formatter: "prettier"
    test_framework: "jest"

  go:
    version: "1.21"
    frameworks: ["gin", "echo", "fiber"]
    default_framework: "gin"
    formatter: "gofmt"
    test_framework: "go test"

  rust:
    version: "1.75"
    frameworks: ["actix", "rocket", "axum"]
    default_framework: "actix"
    formatter: "rustfmt"
    test_framework: "cargo test"

  java:
    version: "21"
    frameworks: ["spring-boot", "quarkus", "micronaut"]
    default_framework: "spring-boot"
    formatter: "google-java-format"
    test_framework: "junit"

  detection:
    confidence_threshold: 70
    use_syntax_analysis: true
    use_extension_analysis: true

  translation:
    preserve_comments: true
    preserve_structure: true
    validation_enabled: true

  cross_validation:
    syntax_check: true
    logic_check: true
    performance_check: true
    security_check: true

  packages:
    auto_update: true
    security_scan: true
    version_check: true

  formatting:
    auto_format: true
    check_on_save: true
    format_on_generation: true