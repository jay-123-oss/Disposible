# ==============================================================================
# AI & ML Extensions Configuration
# ==============================================================================
ai_extensions:
  model_selector:
    available_models:
      - qwen2.5-coder:3b
      - llama3.2:3b
      - mistral:7b
      - codegemma:2b
      - starcoder2:3b
    selection_strategy: "cost_accuracy_balance"
    
  cost_optimizer:
    token_budget: 1000000
    cache_ttl_seconds: 3600
    batch_size: 10
    cost_reduction_target: 50
    
  code_embedder:
    embedding_model: "nomic-embed-text"
    embedding_dim: 768
    chunk_size: 512
    storage_path: "./data/embeddings/"
    
  semantic_searcher:
    search_algorithm: "cosine_similarity"
    top_k_results: 10
    min_similarity: 0.7
    
  auto_completion:
    context_window: 1024
    max_suggestions: 5
    response_time_ms: 50
    acceptance_tracking: true
    
  code_generator:
    languages: ["python", "node", "go", "rust", "java"]
    default_language: "python"
    max_tokens: 4096
    temperature: 0.7
    
  quality_predictor:
    complexity_threshold: 10
    maintainability_threshold: 70
    readability_threshold: 80
    
  bug_predictor:
    high_risk_patterns: ["sql_injection", "xss", "unsafe_eval"]
    medium_risk_patterns: ["memory_leak", "race_condition"]
    low_risk_patterns: ["code_duplication", "unused_variables"]
    
  performance_predictor:
    max_time_complexity: "O(n^2)"
    max_space_complexity: "O(n)"
    optimization_threshold: 80
    
  test_generator:
    test_framework: "pytest"
    coverage_target: 90
    mock_generation: true
    
  refactoring:
    detect_smells: true
    suggest_refactoring: true
    impact_analysis: true
    
  code_reviewer:
    review_depth: "detailed"
    comment_generation: true
    summarize_reviews: true
    
  documentation_generator:
    doc_format: ["markdown", "json", "yaml"]
    include_examples: true
    
  fine_tuning:
    base_model: "qwen2.5-coder:3b"
    training_epochs: 3
    learning_rate: 2e-5
    batch_size: 4
    
  multi_modal:
    image_processing: true
    audio_processing: false
    video_processing: false

gui:
  server:
    host: "0.0.0.0"
    port: 8080
    debug: false
    workers: 4
    
  frontend:
    title: "Fractal Multi-Agent System"
    theme: "dark"
    auto_refresh_seconds: 5
    
  api:
    version: "v1"
    prefix: "/api/v1"
    cors_enabled: true
    origins: ["*"]
    
  websocket:
    enabled: true
    path: "/ws"
    ping_interval: 30
    
  authentication:
    enabled: true
    session_timeout_hours: 24
    token_expiry_hours: 8
    
  static:
    path: "./gui/frontend"
    cache_control: "public, max-age=3600"
    
  logging:
    level: "INFO"
    format: "json"
    path: "./logs/gui.log"
    
  security:
    https_enabled: false
    rate_limit_requests: 100
    rate_limit_window_seconds: 60
