version: "3.8"

services:
  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fractal-node-1
    environment:
      - NODE_ID=node-1
      - NODE_ROLE=leader
      - NODE_PORT=8000
      - CLUSTER_NAME=fractal-cluster
      - PEERS=node-2:8000,node-3:8000
    ports:
      - "8001:8000"
    networks:
      - fractal-distributed-net
    volumes:
      - node1-data:/app/data

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fractal-node-2
    environment:
      - NODE_ID=node-2
      - NODE_ROLE=follower
      - NODE_PORT=8000
      - CLUSTER_NAME=fractal-cluster
      - PEERS=node-1:8000,node-3:8000
    ports:
      - "8002:8000"
    networks:
      - fractal-distributed-net
    volumes:
      - node2-data:/app/data

  node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fractal-node-3
    environment:
      - NODE_ID=node-3
      - NODE_ROLE=follower
      - NODE_PORT=8000
      - CLUSTER_NAME=fractal-cluster
      - PEERS=node-1:8000,node-2:8000
    ports:
      - "8003:8000"
    networks:
      - fractal-distributed-net
    volumes:
      - node3-data:/app/data

networks:
  fractal-distributed-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
