apiVersion: v1
kind: Service
metadata:
  name: fractal-headless
  labels:
    app: fractal-distributed
spec:
  clusterIP: None
  selector:
    app: fractal-distributed
  ports:
    - port: 8000
      name: rpc
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fractal-cluster-lb
  labels:
    app: fractal-distributed
spec:
  type: LoadBalancer
  selector:
    app: fractal-distributed
  ports:
    - port: 80
      targetPort: 8000
      name: http
