testing:
  end_to_end_enabled: true
  user_scenarios_enabled: true
  business_flows_enabled: true
  role_based_enabled: true

validation:
  use_case_validation: true
  acceptance_criteria: true
  ui_validation: true
  workflow_validation: true

integration:
  api_integration: true
  database_integration: true
  external_services: true
  event_integration: true

data:
  integrity_check: true
  consistency_check: true
  accuracy_check: true
  completeness_check: true

security:
  auth_validation: true
  authorization_validation: true
  data_protection: true
  compliance_validation: true

performance:
  response_time_threshold_ms: 200
  throughput_threshold_rps: 100
  resource_usage_threshold: 80
  scalability_efficiency: 80

feedback:
  surveys_enabled: true
  feedback_analysis: true
  satisfaction_tracking: true
  improvement_suggestions: true

acceptance:
  min_acceptance_score: 85
  require_uat_signoff: true
  approval_required: true
  signoff_authority: "project_manager"
