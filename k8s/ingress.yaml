apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fractal-core-ingress
  namespace: fractal-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: fractal.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fractal-core-service
            port:
              number: 80
