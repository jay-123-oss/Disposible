apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fractal-core-hpa
  namespace: fractal-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fractal-core-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
